<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 160" font-family="'Amazon Ember', 'Helvetica Neue', Roboto, Arial, sans-serif">
  <defs>
    <linearGradient id="dsql" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B48CC"/>
      <stop offset="100%" stop-color="#2E27AD"/>
    </linearGradient>
    <linearGradient id="kinesis" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8C4FFF"/>
      <stop offset="100%" stop-color="#6B3BC2"/>
    </linearGradient>
    <linearGradient id="firehose" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8C4FFF"/>
      <stop offset="100%" stop-color="#6B3BC2"/>
    </linearGradient>
    <linearGradient id="lambda" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ED7100"/>
      <stop offset="100%" stop-color="#C25500"/>
    </linearGradient>
    <linearGradient id="s3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3F8624"/>
      <stop offset="100%" stop-color="#2D6B19"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5" fill="#879196"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="160" rx="8" fill="#F2F3F3"/>

  <!-- Header bar -->
  <rect x="0" y="0" width="720" height="38" rx="8" fill="#232F3E"/>
  <rect x="0" y="8" width="720" height="30" fill="#232F3E"/>
  <rect x="0" y="38" width="720" height="3" fill="#FF9900"/>
  <text x="360" y="26" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600" letter-spacing="0.5">DSQL CDC  &#x2192;  Firehose  &#x2192;  S3</text>

  <!-- Aurora DSQL -->
  <rect x="18" y="58" width="120" height="48" rx="8" fill="url(#dsql)" filter="url(#shadow)"/>
  <rect x="24" y="64" width="4" height="36" rx="2" fill="#FF9900" opacity="0.7"/>
  <text x="82" y="79" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="600">Aurora DSQL</text>
  <text x="82" y="95" text-anchor="middle" fill="#C5CAE9" font-size="9">Source Database</text>

  <!-- Arrow: DSQL → Kinesis -->
  <line x1="138" y1="82" x2="164" y2="82" stroke="#879196" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="141" y="68" width="24" height="12" rx="3" fill="#FF9900"/>
  <text x="153" y="77" text-anchor="middle" fill="#FFFFFF" font-size="7" font-weight="600">CDC</text>

  <!-- Kinesis -->
  <rect x="170" y="58" width="120" height="48" rx="8" fill="url(#kinesis)" filter="url(#shadow)"/>
  <rect x="176" y="64" width="4" height="36" rx="2" fill="#FF9900" opacity="0.7"/>
  <text x="234" y="79" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="600">Kinesis</text>
  <text x="234" y="95" text-anchor="middle" fill="#D1C4E9" font-size="9">Data Stream</text>

  <!-- Arrow: Kinesis → Firehose -->
  <line x1="290" y1="82" x2="318" y2="82" stroke="#879196" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Firehose -->
  <rect x="324" y="58" width="120" height="48" rx="8" fill="url(#firehose)" filter="url(#shadow)"/>
  <rect x="330" y="64" width="4" height="36" rx="2" fill="#FF9900" opacity="0.7"/>
  <text x="388" y="79" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="600">Firehose</text>
  <text x="388" y="95" text-anchor="middle" fill="#D1C4E9" font-size="9">Delivery Stream</text>

  <!-- Arrow: Firehose → S3 -->
  <line x1="444" y1="82" x2="472" y2="82" stroke="#879196" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- S3 -->
  <rect x="478" y="58" width="120" height="48" rx="8" fill="url(#s3)" filter="url(#shadow)"/>
  <text x="538" y="79" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="600">Amazon S3</text>
  <text x="538" y="95" text-anchor="middle" fill="#C8E6C9" font-size="9">JSON Archive</text>

  <!-- Lambda Transform branch off Firehose -->
  <path d="M388,106 L388,120 L630,120 L630,82" stroke="#879196" stroke-width="1.2" fill="none" stroke-dasharray="4,3"/>
  <rect x="618" y="58" width="86" height="48" rx="8" fill="url(#lambda)" filter="url(#shadow)"/>
  <text x="661" y="79" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="600">Lambda</text>
  <text x="661" y="95" text-anchor="middle" fill="#FFE0B2" font-size="8">Transform</text>
  <text x="509" y="134" text-anchor="middle" fill="#545B64" font-size="8" font-style="italic">(optional)</text>

  <!-- Arrow from Lambda back up to Firehose path -->
  <line x1="618" y1="82" x2="600" y2="82" stroke="#879196" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
</svg>
